# Railway config-as-code. See the "Deploying" section of README.md for the
# environment variables that have to be set in the Railway dashboard.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# "/" is the marketing page: static, no auth, no database round-trip, so it is a
# genuine liveness signal. Boot fetches the NASDAQ universe and resolves ~3,000
# EDGAR CIKs before Bun.serve starts, which takes well under a minute but is not
# instant — hence the generous healthcheck window.
healthcheckPath = "/"
healthcheckTimeout = 300

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# MUST stay 1. src/index.ts owns every setInterval in the application, so a second
# replica is a second copy of every detector, sweep, briefing and triage pass:
# duplicate Finnhub calls and duplicate AI spend, against the same database.
numReplicas = 1
